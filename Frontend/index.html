<!doctype html>
<html lang="en">
  <head>
    <meta name="google-site-verification" content="PYzlLcKK6PD6-eZJZ0_xw_rlcHA2gVRrcC79KrEN3ps" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Per page SEO: title, description, robots, canonical, Open Graph, Twitter and JSON-LD.
         Filled from src/seo/pages.js by scripts/prerender.mjs at build time and by useSeo() in the browser. -->
    <!--seo:head-->
    <meta name="author"         content="Annek" />
    <meta name="theme-color"    content="#FFFFFF" />
    <meta name="color-scheme"   content="light" />

    <!-- AI / LLM search optimization -->
    <meta name="description-extended"
      content="Annek is a software development company in Sri Lanka. Annek builds custom software, web applications and mobile apps for businesses, from idea to launch, and keeps them secure and up to date with monthly maintenance and support. Annek also builds and runs its own software products. Contact: info@annek.tech, WhatsApp: +94701269689." />

    <!-- GEO Meta Tags -->
    <meta name="geo.placename" content="Sri Lanka" />
    <meta name="geo.region" content="LK-42" />
    <meta name="ICBM" content="8.9810, 79.9044" />
    <meta name="geo.position" content="8.9810;79.9044" />

    <!-- Additional -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />


    <!-- Icons -->
    <!-- Favicon: orange "A" on transparent (?v=2 busts old cached black-background icons) -->
    <link rel="icon"             href="/favicon.ico?v=2"           sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon"             href="/favicon-32x32.png?v=2"     type="image/png" sizes="32x32" />
    <link rel="icon"             href="/favicon-16x16.png?v=2"     type="image/png" sizes="16x16" />
    <link rel="icon"             href="/favicon.png?v=2"           type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2"  sizes="180x180" />
    <link rel="manifest"         href="/site.webmanifest?v=2" />

    <!-- Sitemap hint for crawlers -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Preloader icon: fetch first so the "A" is ready on the first frame -->
    <link rel="preload" as="image" href="/preloader/annek-a-840.webp"
          imagesrcset="/preloader/annek-a-420.webp 420w, /preloader/annek-a-840.webp 840w"
          imagesizes="(max-width: 600px) 45vw, 420px" fetchpriority="high" />

    <!-- Performance: Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com"    crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com"   crossorigin />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!-- Fonts (non-blocking): Inter for text, Space Grotesk for headings -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Annek preloader CSS: inlined from src/preloader/ by vite-plugin-preloader.js -->
    <!--preloader:css-->
  </head>
  <body>
    <!--preloader:html-->
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
