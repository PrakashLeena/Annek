    <!-- Intro loader (inline so it paints before the JS bundle loads) -->
    <style>
      #intro-loader{position:fixed;inset:0;z-index:2147483000;background:#040404;display:flex;align-items:center;justify-content:center;transition:opacity .55s ease,visibility .55s ease}
      #intro-loader video{width:100%;height:100%;max-width:1280px;object-fit:contain;background:#040404;-webkit-mask-image:radial-gradient(ellipse 60% 60% at center,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 60% 60% at center,#000 60%,transparent 100%)}
      #intro-loader.intro-hide{opacity:0;visibility:hidden;pointer-events:none}
      #intro-skip{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:rgba(255,255,255,.75);font:500 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.04em;cursor:pointer}
      #intro-skip:hover{background:rgba(255,255,255,.12);color:#fff}
      html.intro-active,html.intro-active body{overflow:hidden}
    </style>

  <body>
    <div id="intro-loader" aria-label="Loading Annek" role="status">
      <video id="intro-video" muted playsinline preload="none" poster="/intro/annek-intro-poster.jpg"></video>
      <button id="intro-skip" type="button">Skip</button>
    </div>
    <script>
      (function () {
        var el = document.getElementById("intro-loader");
        var seen = false;
        try { seen = sessionStorage.getItem("annek_intro") === "1"; } catch (e) {}
        // Play only on the home page, once per browser session.
        if (seen || location.pathname !== "/") { el.parentNode.removeChild(el); return; }
        try { sessionStorage.setItem("annek_intro", "1"); } catch (e) {}
        document.documentElement.classList.add("intro-active");
        var v = document.getElementById("intro-video"), done = false;
        function hide() {
          if (done) return; done = true;
          el.classList.add("intro-hide");
          document.documentElement.classList.remove("intro-active");
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 600);
        }
        document.getElementById("intro-skip").addEventListener("click", hide);
        setTimeout(hide, 6500); // hard cap: never block the site
        if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { setTimeout(hide, 900); return; }
        [["/intro/annek-intro.webm", "video/webm"], ["/intro/annek-intro.mp4", "video/mp4"]].forEach(function (s, i, a) {
          var src = document.createElement("source"); src.src = s[0]; src.type = s[1];
          if (i === a.length - 1) src.addEventListener("error", hide);
          v.appendChild(src);
        });
        v.addEventListener("ended", hide);
        v.preload = "auto"; v.load();
        var p = v.play(); if (p && p.catch) p.catch(function () { setTimeout(hide, 1500); });
      })();
    </script>
